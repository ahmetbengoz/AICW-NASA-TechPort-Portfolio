name: reproduce-analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_analysis.py --output-dir /tmp/aicw-output --figure-dir /tmp/aicw-figures
      - run: test -s /tmp/aicw-output/run_manifest.json
